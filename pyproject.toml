[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "musicdl"
version = "0.1.0"
description = "Python client library for the self-hosted NextMusic API: playlists, song info, playback URLs and downloads"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.24",
    "pyinstaller>=6.0",
    "pipx>=1.7",
]
cli = [
    "typer>=0.9",
    "rich>=13.0",
]

[project.scripts]
musicdl = "musicdl_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/musicdl", "src/musicdl_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["musicdl"]
